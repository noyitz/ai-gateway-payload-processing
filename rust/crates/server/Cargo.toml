[package]
name = "ipp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ipp-server"
path = "src/main.rs"

[lib]
name = "ipp_server_lib"
path = "src/lib.rs"

[dependencies]
ext-proc-proto = { path = "../ext-proc-proto" }
ipp-framework = { path = "../framework" }
ipp-translators = { path = "../translators" }
ipp-k8s-plugins = { path = "../k8s-plugins" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic = "0.12"
prost = "0.13"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio-stream = "0.1"
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }

[features]
go-plugins = ["ipp-go-ffi"]

[dependencies.ipp-go-ffi]
path = "../go-ffi"
optional = true

[dev-dependencies]
tokio-stream = "0.1"
