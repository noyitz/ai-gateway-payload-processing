[workspace]
resolver = "2"
members = [
    "crates/ext-proc-proto",
    "crates/framework",
    "crates/translators",
    "crates/k8s-plugins",
    "crates/server",
    "crates/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
