name: Publish Helm Chart to OCI Registry

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/payload-processing/**'

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to quay.io OCI registry
        run: |
          echo "${{ secrets.QUAY_HELM_TOKEN }}" | \
            helm registry login quay.io -u "${{ secrets.QUAY_HELM_USERNAME }}" --password-stdin

      - name: Update chart dependencies
        run: helm dependency update deploy/payload-processing

      - name: Package chart
        run: helm package deploy/payload-processing -d /tmp/charts

      - name: Push chart to OCI registry
        run: helm push /tmp/charts/payload-processing-*.tgz oci://quay.io/opendatahub/charts
