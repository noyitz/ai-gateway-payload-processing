[package]
name = "ipp-downstream"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ipp-server"
path = "src/main.rs"

[dependencies]
# Upstream
ipp-framework.workspace = true
ipp-plugins.workspace = true
ipp-server.workspace = true
ext-proc-proto.workspace = true

# Downstream (product-specific)
ipp-model-provider-resolver = { path = "../crates/model-provider-resolver" }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic = "0.12"
tonic-health = "0.12"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
prometheus = "0.13"
